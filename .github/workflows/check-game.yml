name: Check Game Pull Request

on:
  pull_request:
    paths:
      - "games/**"

permissions:
  contents: read

jobs:
  check-game:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check the game
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          python3 - <<'PY'
          import os, re, subprocess
          from pathlib import Path

          base = os.environ["BASE_SHA"]
          head = os.environ["HEAD_SHA"]
          author = os.environ["AUTHOR"].lower()

          changed = subprocess.run(
              ["git", "diff", "--name-only", f"{base}...{head}"],
              capture_output=True, text=True, check=True
          ).stdout.splitlines()

          errors = []
          games = set()

          for path in changed:
              parts = path.split("/")
              if parts[0] != "games" or len(parts) != 4:
                  errors.append(f"This file is not allowed in a game PR: {path}")
              else:
                  games.add((parts[1], parts[2]))

          if len(games) != 1:
              errors.append("A pull request must add or change exactly one game.")

          for user, game in games:
              if user != author:
                  errors.append(f"Folder games/{user} must match your GitHub username ({author}).")

              if not re.fullmatch(r"[a-z0-9-]+", game):
                  errors.append(f"Game folder name '{game}' must use lowercase letters, numbers and hyphens only.")

              folder = Path("games") / user / game
              if not folder.is_dir():
                  errors.append(f"Folder {folder} was removed or is missing.")
                  continue

              names = sorted(p.name for p in folder.iterdir())
              if names != ["index.html", "script.js", "style.css"]:
                  errors.append(f"The folder must contain exactly index.html, style.css and script.js. Found: {names}")

              total = sum(p.stat().st_size for p in folder.rglob("*") if p.is_file())
              if total > 500 * 1024:
                  errors.append(f"The game folder is {total // 1024} KB. The limit is 500 KB.")

              for name in names:
                  file = folder / name
                  if not file.is_file():
                      continue
                  text = file.read_text(encoding="utf-8", errors="ignore")
                  if re.search(r"https?://", text):
                      errors.append(f"{name}: external links are not allowed.")
                  if re.search(r"\bfetch\s*\(|XMLHttpRequest|WebSocket", text):
                      errors.append(f"{name}: network requests are not allowed.")

              index = folder / "index.html"
              if index.is_file():
                  html = index.read_text(encoding="utf-8", errors="ignore").lower()
                  if "<title>" not in html:
                      errors.append("index.html needs a <title> with the game name.")
                  if "viewport" not in html:
                      errors.append("index.html needs the viewport meta tag (for mobile).")

          if errors:
              print("Problems found:")
              for e in errors:
                  print(" -", e)
              raise SystemExit(1)

          print("All checks passed.")
          PY
