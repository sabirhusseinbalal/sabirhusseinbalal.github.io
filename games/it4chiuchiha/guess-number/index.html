<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>Guess Number Game</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="game-wrap">
      <section class="card left">
        <h1>Guess the Number</h1>
        <p class="lead">
          I’m thinking of a secret number between <strong>1</strong> and <strong>100</strong>. Try to guess it!
        </p>

<form class="controls" id="guess-form" novalidate>
    <label class="sr-only" for="guess">
        Your guess (1 to 100)
    </label>

    <input
        id="guess"
        class="guess-input"
        type="number"
        min="1"
        max="100"
        step="1"
        placeholder="Your guess..."
        aria-describedby="msg"
    />

    <button class="check-btn" type="submit" id="checkbtn">
        Check
    </button>
</form>

<div class="message" id="msg" role="status" aria-live="polite">
    Start guessing...
</div>

<button class="again-btn" id="reset" type="button">
    Reset Game
</button>
      </section>

      <aside class="card right">
        <div class="number-display" id="num">?</div>
      </aside>
    </main>

    <script src="script.js"></script>
</body>
</html>
