<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        font-family: system-ui, -apple-system, sans-serif;
        background: #0d0d0d;
        color: #f5f5f5;
        text-align: center;
      }

      
:root {
    --red: #e63946;
    --background: #0d0d0d;
    --card: #171717;
    --text: #ffffff;
    --muted: #aaaaaa;
}


      .box {
        max-width: 480px;
      }
      h1 {
        font-size: 64px;
        margin: 0 0 8px;
        color: var(--red);
      }
      p {
        color: var(--muted);
        line-height: 1.6;
        margin: 0 0 24px;
      }
      .actions {
        display: flex;
        gap: 12px;
        justify-content: center;
        flex-wrap: wrap;
      }

      a.button{
        text-decoration: none;
      }

.button {
    display: inline-block;
    padding: 13px 25px;

    border: 2px solid var(--red);
    border-radius: 7px;

    font-size: 15px;
    font-weight: bold;

    transition: 0.3s;
}

.button.primary {
    background: var(--red);
    color: white;
}

.button.primary:hover {
    background: transparent;
    transform: translateY(-3px);
}

.button.secondary {
    background: transparent;
    color: white;
}

.button.secondary:hover {
    background: var(--red);
    transform: translateY(-3px);
}

    </style>
  </head>
  <body>
    <div class="box">
      <h1>404</h1>
      <p>That page or game path doesn't exist. Maybe a link had a typo or moved.</p>
      <div class="actions">
        <a href="/" class="button primary">Go Home</a>
        <a class="button secondary" href="/#games">See Games</a>
      </div>
    </div>
  </body>
</html>
